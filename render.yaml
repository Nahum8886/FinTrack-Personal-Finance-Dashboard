services:
  - type: web
    name: fintrack
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: DATABASE_PATH
        value: /var/data/finance.db
    disk:
      name: fintrack-data
      mountPath: /var/data
      sizeGB: 1
